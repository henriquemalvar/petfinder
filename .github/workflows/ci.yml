name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint + typecheck + testes)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder
          POSTGRES_DB: petfinder_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run --workspace=@petfinder/api postinstall
      - name: Lint
        run: npm run lint --workspace=@petfinder/api
      - name: Typecheck (src + prisma/seed)
        run: npm run typecheck --workspace=@petfinder/api
      - name: Typecheck dos testes
        run: npm run typecheck:test --workspace=@petfinder/api
      - name: Testes unitários
        working-directory: apps/api
        run: npm test
      - name: Testes de integração
        working-directory: apps/api
        run: npm run test:integration

  web:
    name: Web (lint + typecheck + testes + build)
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate (dep do build)
        run: npm run --workspace=@petfinder/api postinstall
      - name: Lint
        run: npm run lint --workspace=@petfinder/web
      - name: Typecheck
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Testes
        run: npm test --workspace=@petfinder/web
      - name: Build
        run: npm run build --workspace=@petfinder/web

  e2e:
    name: E2E (Cypress)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder
          POSTGRES_DB: petfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://petfinder:petfinder@localhost:5432/petfinder
      DIRECT_URL: postgresql://petfinder:petfinder@localhost:5432/petfinder
      JWT_SECRET: e2e-secret
      NEXT_PUBLIC_API_URL: http://localhost:3333
      # A suíte roda tudo de um mesmo IP; o limite de 20/15min do /auth
      # estouraria com os logins de UI somados aos de cy.request.
      AUTH_RATE_LIMIT_MAX: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Migrations + seed
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npm run seed
      - name: Build
        run: |
          npm run build --workspace=@petfinder/api
          npm run build --workspace=@petfinder/web
      - name: Sobe API e web
        run: |
          npm start --workspace=@petfinder/api > api.log 2>&1 &
          npm start --workspace=@petfinder/web > web.log 2>&1 &
          npx --yes wait-on@9.5.1 -t 90000 http://localhost:3333/api/posts http://localhost:3000
      - name: Cypress
        run: npm run cy:run --workspace=@petfinder/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            apps/web/cypress/screenshots
            api.log
            web.log
          if-no-files-found: ignore
