name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API (lint + typecheck + testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petfinder
          POSTGRES_PASSWORD: petfinder
          POSTGRES_DB: petfinder_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run --workspace=@petfinder/api postinstall
      - name: Lint
        run: npm run lint --workspace=@petfinder/api
      - name: Typecheck (src + prisma/seed)
        run: npm run typecheck --workspace=@petfinder/api
      - name: Testes unitários
        working-directory: apps/api
        run: npm test
      - name: Testes de integração
        working-directory: apps/api
        run: npm run test:integration

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prisma generate (dep do build)
        run: npm run --workspace=@petfinder/api postinstall
      - name: Lint
        run: npm run lint --workspace=@petfinder/web
      - name: Typecheck
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Build
        run: npm run build --workspace=@petfinder/web
